name: Release Please

permissions: {}

on:
  push:
    branches:
      - main

jobs:
  release-please:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      version: ${{ steps.release-please.outputs.tag_name }}
      should-release: ${{ steps.release-please.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445 # v4.2.0
        id: release-please
        with:
          release-type: simple
          token: ${{ github.token }}

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.should-release == 'true' }}
    timeout-minutes: 10
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build
        run: |
          xcodebuild \
            -project ./Koto.xcodeproj \
            -scheme Koto \
            -configuration Release \
            -arch arm64 -arch x86_64 \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$(pwd)/build/\$(CONFIGURATION)" \
            CODE_SIGNING_ALLOWED=NO
          mkdir -p ./tmp/app
          mv ./build/Release/Koto.app ./tmp/app/

      - name: Build Package
        run: |
          xcrun pkgbuild \
            --root ./tmp/app \
            --component-plist ./pkg.plist \
            --identifier me.koki.inputmethod.Koto \
            --install-location '/Library/Input Methods' \
            ./tmp/tmp.pkg

      - name: Build Installer
        run: |
          xcrun productbuild \
            --distribution distribution.xml \
            --package-path ./tmp \
            ./tmp/Koto.pkg

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Koto.pkg
          path: ./tmp/Koto.pkg

  release:
    needs:
      - release-please
      - build
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Koto.pkg
          path: ./tmp
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: ./tmp/Koto.pkg
          tag_name: ${{ needs.release-please.outputs.version }}

  release-cask:
    needs:
      - release
      - release-please
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Download Artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: Koto.pkg
          path: ./tmp

      - name: Metadata
        id: metadata
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "version=${VERSION#v}"
            echo "sha256=$(shasum -a 256 ./tmp/Koto.pkg | awk '{print $1}')"
            echo "desc=$(gh repo view "$GITHUB_REPOSITORY" --json description --jq .description)"
          } >> "$GITHUB_OUTPUT"

      - name: Build Homebrew Cask
        uses: ./.github/actions/build-cask
        with:
          version: ${{ steps.metadata.outputs.version }}
          sha256: ${{ steps.metadata.outputs.sha256 }}
          desc: ${{ steps.metadata.outputs.desc }}
          output-path: ./koto.rb

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.HOMEBREW_TAP_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write # for updating files

      - name: Update Homebrew Cask
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          KOTO_VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          SHA=$(gh api repos/koki-develop/homebrew-tap/contents/Casks/koto.rb --jq '.sha')
          gh api --method PUT repos/koki-develop/homebrew-tap/contents/Casks/koto.rb \
            --field message="Brew cask update for koto version v${KOTO_VERSION}" \
            --field content=@<(base64 -i ./koto.rb) \
            --field sha="$SHA"
