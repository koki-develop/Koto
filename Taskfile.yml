version: '3'

vars:
  CONFIGURATION: Debug

tasks:
  build:
    cmds:
      - |-
        xcodebuild \
          -project ./Koto.xcodeproj \
          -scheme Koto \
          -configuration {{.CONFIGURATION}} \
          CONFIGURATION_BUILD_DIR="$(pwd)/build/\$(CONFIGURATION)" \
          CODE_SIGNING_ALLOWED=NO

  build:release:
    cmds:
      - task: build
        vars:
          CONFIGURATION: Release

  clean:
    cmd: rm -rf ./build

  install:
    deps: [build]
    cmds:
      # cp -R は既存のバンドルへ「混ぜる」ので、前のビルドの置き土産
      # (Debug の Koto.debug.dylib など)が残り、_CodeSignature と中身が食い違う。
      # かといって先に消すと、コピーに失敗したときに入力メソッドが無い状態で取り残される。
      # 隣に置き切ってから差し替える。
      - rm -rf ~/Library/Input\ Methods/Koto.app.new
      - cp -R ./build/{{.CONFIGURATION}}/Koto.app ~/Library/Input\ Methods/Koto.app.new
      - rm -rf ~/Library/Input\ Methods/Koto.app
      - mv ~/Library/Input\ Methods/Koto.app.new ~/Library/Input\ Methods/Koto.app

  install:release:
    deps:
      - build:release
    cmds:
      - task: install
        vars:
          CONFIGURATION: Release

  uninstall:
    cmds:
      - rm -rf ~/Library/Input\ Methods/Koto.app
      - task: stop

  stop:
    cmds:
      - pkill Koto

  fmt:
    cmd: swift-format format --recursive --in-place .
